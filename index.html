<body>
<div id="app-root"></div>
<style>
  :root{
    --bg:#0B1220;
    --panel:#121C2E;
    --panel-2:#0F1830;
    --border:#223049;
    --amber:#F2A93B;
    --amber-dim:#8A6A2E;
    --green:#3ECF8E;
    --red:#E85C4A;
    --text:#EDF2F8;
    --muted:#8CA0BE;
    --muted-2:#5C7191;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  #app-root{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    padding-bottom:84px;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  .hero{
    padding:22px 18px 16px;
    background:
      radial-gradient(circle at 85% -10%, rgba(242,169,59,0.14), transparent 55%),
      linear-gradient(180deg, #0E1830 0%, #0B1220 100%);
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
  h1.title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.5px;
    margin:6px 0 2px;
  }
  .subtitle{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .dial-row{display:flex;align-items:center;gap:16px;}
  .dial{position:relative;width:96px;height:96px;flex:none;}
  .dial svg{transform:rotate(-90deg);}
  .dial-track{fill:none;stroke:#1B2740;stroke-width:8;}
  .dial-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
  .dial-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .dial-num{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;}
  .dial-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .next-info{flex:1;min-width:0;}
  .next-info .school{font-weight:700;font-size:15px;margin-bottom:2px;}
  .next-info .what{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .next-info .when{font-family:var(--mono);font-size:11px;color:var(--amber);}

  .stat-strip{display:flex;gap:8px;margin-top:16px;}
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:8px 10px;
  }
  .stat .n{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--text);}
  .stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;}

  .tabs{display:flex;gap:6px;padding:14px 18px 4px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--border);color:var(--muted);
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap;
    padding:9px 12px;border-radius:9px;text-align:center;
  }
  .tab-btn.active{background:linear-gradient(180deg,#1B2740,#141E34);color:var(--amber);border-color:var(--amber-dim);}

  .view{padding:14px 18px 6px;display:none;}
  .view.active{display:block;}

  .section-label{
    font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted-2);
    text-transform:uppercase;margin:18px 0 8px;
  }
  .section-label:first-child{margin-top:2px;}

  /* Timeline */
  .wp{
    display:flex;gap:12px;align-items:center;background:var(--panel);
    border:1px solid var(--border);border-left:3px solid var(--sc,var(--border));
    border-radius:12px;padding:10px 12px;margin-bottom:8px;
  }
  .wp-dial{width:52px;height:52px;flex:none;position:relative;}
  .wp-dial svg{transform:rotate(-90deg);}
  .wp-dial .dial-num{font-size:13px;}
  .wp-dial .dial-lbl{display:none;}
  .wp-body{flex:1;min-width:0;}
  .wp-school{font-weight:700;font-size:13.5px;}
  .wp-what{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .wp-date{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:3px;}
  .wp-cal{
    flex:none;width:28px;height:28px;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--border);color:var(--amber);display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:700;
  }
  .wp-cal.added{color:var(--green);border-color:#2a5f47;}
  .badge{
    display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.5px;padding:2px 6px;border-radius:5px;text-transform:uppercase;
  }
  .badge.strong{background:rgba(62,207,142,0.15);color:var(--green);}
  .badge.good{background:rgba(242,169,59,0.15);color:var(--amber);}
  .badge.limited{background:rgba(232,92,74,0.15);color:var(--red);}
  .badge.neutral{background:rgba(140,160,190,0.15);color:var(--muted);}

  /* Schools */
  .filter-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .filter-row label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .toggle{
    width:34px;height:20px;border-radius:20px;background:var(--panel);border:1px solid var(--border);
    position:relative;flex:none;
  }
  .toggle.on{background:var(--amber-dim);}
  .toggle .knob{
    position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;
    background:var(--muted);transition:left .15s ease, background .15s ease;
  }
  .toggle.on .knob{left:15px;background:var(--amber);}

  .school-card{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--sc, var(--border));
    border-radius:14px;
    margin-bottom:10px;overflow:hidden;
  }
  .school-head{padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .school-head .info{flex:1;min-width:0;}
  .school-head .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sc,var(--muted));box-shadow:0 0 5px var(--sc,transparent);}
  .school-head .meta{font-size:11px;color:var(--muted);margin-top:1px;}
  .chev{color:var(--muted-2);font-size:13px;transition:transform .2s ease;}
  .school-card.open .chev{transform:rotate(90deg);}
  .school-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .school-card.open .school-body{max-height:900px;}
  .school-body-inner{padding:0 14px 14px;border-top:1px solid var(--border);padding-top:12px;}
  .row-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .row-line:last-of-type{border-bottom:none;}
  .row-line .k{color:var(--muted);flex:none;}
  .row-line .v{text-align:right;font-family:var(--mono);font-size:11.5px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 8px;}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .status-row{display:flex;gap:6px;margin-top:12px;}
  .status-btn{
    flex:1;font-family:var(--sans);font-size:10.5px;font-weight:700;padding:7px 4px;
    border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    text-align:center;
  }
  .status-btn.sel-notstarted{background:var(--panel-2);color:var(--muted);}
  .status-btn.sel-progress.active{background:rgba(242,169,59,0.18);color:var(--amber);border-color:var(--amber-dim);}
  .status-btn.sel-submitted.active{background:rgba(62,207,142,0.18);color:var(--green);border-color:#2a5f47;}
  .status-btn.sel-notstarted.active{background:rgba(140,160,190,0.18);color:var(--text);border-color:var(--muted-2);}

  /* Soccer */
  .coach-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .coach-card .sname{font-weight:800;font-size:14px;}
  .coach-card .coach{font-family:var(--mono);font-size:11px;color:var(--amber);margin:3px 0 6px;}
  .coach-card .desc{font-size:12px;color:var(--muted);line-height:1.5;}
  .team-status{display:flex;align-items:center;gap:8px;margin-bottom:8px;}

  /* Checklist */
  .cl-cat{margin-bottom:18px;}
  .cl-item{
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--sc,var(--border));
    border-radius:10px;padding:10px 12px;margin-bottom:8px;
  }
  .cl-top{display:flex;align-items:flex-start;gap:10px;}
  .cbox{
    width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted-2);flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
  }
  .cbox.checked{background:var(--green);border-color:var(--green);}
  .cbox.checked:after{content:"";width:10px;height:6px;border-left:2px solid #06231A;border-bottom:2px solid #06231A;transform:rotate(-45deg) translate(1px,-1px);}
  .cl-text{font-size:13px;line-height:1.4;}
  .cl-text.checked{color:var(--muted-2);text-decoration:line-through;}
  .cl-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .cl-meta{display:flex;align-items:center;gap:7px;margin-top:9px;padding-left:30px;flex-wrap:wrap;}
  .cl-due{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
  .cl-schools{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted-2);}
  .cl-sdot{width:7px;height:7px;border-radius:50%;flex:none;}
  .cl-cal-btn{
    margin-left:auto;background:var(--panel-2);border:1px solid var(--border);color:var(--amber);

  // ---------- STATE ----------
  let state = { schoolStatus:{}, checklist:{}, openSchools:{}, schoolNotes:{}, journal:[], ncOnly:false };
  let saveTimer = null;

  function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- CALENDAR / REMINDERS ----------
  function icsEscape(str){
    return String(str).replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g,'\\n');
  }
  function dateToICS(dateStr){
    return dateStr.replace(/-/g,'');
  }
  function nextDay(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+1);
    return d.toISOString().slice(0,10).replace(/-/g,'');
  }
  function buildICS(events){
    let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ethan College Tracker//EN','CALSCALE:GREGORIAN'];
    events.forEach((ev,i)=>{
      const uid = 'ethan-tracker-' + Date.now() + '-' + i + '@local';
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+uid);
      lines.push('DTSTAMP:'+dateToICS(new Date().toISOString().slice(0,10))+'T000000Z');
      lines.push('DTSTART;VALUE=DATE:'+dateToICS(ev.date));
      lines.push('DTEND;VALUE=DATE:'+nextDay(ev.date));
      lines.push('SUMMARY:'+icsEscape(ev.title));
      if(ev.desc) lines.push('DESCRIPTION:'+icsEscape(ev.desc));
      lines.push('BEGIN:VALARM');
      lines.push('ACTION:DISPLAY');
      lines.push('DESCRIPTION:Reminder');
      lines.push('TRIGGER:-P1D');
      lines.push('END:VALARM');
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS(filename, icsContent){
    const blob = new Blob([icsContent], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  function fmtDate(d){
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function daysUntil(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    return Math.round((d - TODAY)/86400000);
  }
  function urgencyColor(days){
    if(days < 0) return '#5C7191';
    if(days <= 30) return '#E85C4A';
    if(days <= 60) return '#F2A93B';
    return '#3ECF8E';
  }
  function fitClass(v){ return v; }

  function allDeadlines(){
    let list = [];
    SCHOOLS.forEach(s=>{
      s.deadlines.forEach(d=>{
        list.push({school:s.name, short:s.short, label:d.label, date:d.date, id:s.id, color:s.color});
      });
    });
    list.sort((a,b)=> new Date(a.date) - new Date(b.date));
    return list;
  }

  function makeDial(days, size, strokeSize){
    const r = (size/2) - strokeSize;
    const circ = 2*Math.PI*r;
    const pct = days < 0 ? 1 : Math.max(0, Math.min(1, days/120));
    const offset = circ * (1-pct);
    const color = urgencyColor(days);
    const label = days < 0 ? 'PASSED' : (days===0 ? 'TODAY' : days+'d');
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="dial-track" cx="${size/2}" cy="${size/2}" r="${r}"/>
      <circle class="dial-fill" cx="${size/2}" cy="${size/2}" r="${r}"
        stroke="${color}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="dial-center"><div class="dial-num" style="color:${color}">${label}</div><div class="dial-lbl">days</div></div>`;
  }

    let html = `

      <div class="subtitle">Pilot &middot; Soccer &middot; Business &middot; Digital Forensics</div>`;

      html += `

  function render(){
    const root = document.getElementById('app-root');
    root.innerHTML = renderHero()
      + renderTabs(currentTab)
      + renderTimeline()
      + renderSchools()
      + renderSoccer()
      + renderPlaybook()
      + renderNotes()
      + renderChecklist()
      + renderNav(currentTab);
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+currentTab).classList.add('active');
    attachHandlers();

  function attachHandlers(){
    document.querySelectorAll('[data-tab]').forEach(el=>{
      el.addEventListener('click', ()=>{ currentTab = el.getAttribute('data-tab'); render(); });
    });
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        state.openSchools[id] = !state.openSchools[id];
        render();
        currentTab='schools'; document.getElementById('view-schools').classList.add('active');
        document.getElementById('view-timeline').classList.remove('active');
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      });
    });
    document.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-goto');
        state.openSchools[id] = true;
        currentTab = 'schools';
        render();
        setTimeout(()=>{
          const card = document.getElementById('card-'+id);
          if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
        }, 50);
      });
    });
    document.querySelectorAll('[data-status]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const [id, status] = el.getAttribute('data-status').split(':');
        state.schoolStatus[id] = status;
        saveState();
        render();
      });
    });
    document.querySelectorAll('[data-check]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-check');
        state.checklist[id] = !state.checklist[id];
        saveState();
        render();
        currentTab='checklist';
      });
    });
    // Per-checklist-item reminder
    document.querySelectorAll('[data-ics-check]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = el.getAttribute('data-ics-check');
        const item = CHECKLIST.flatMap(c=>c.items).find(i=>i.id===id);
        if(!item || !item.due) return;
        const desc = item.sub || '';
        downloadICS('reminder-'+id+'.ics', buildICS([{title: item.text, date: item.due, desc}]));
        el.textContent = 'Added \u2713';
        el.classList.add('added');
        setTimeout(()=>{ el.textContent = '+ Remind Me'; el.classList.remove('added'); }, 2000);
      });
    });
    // Single deadline reminder (Timeline tab)
    document.querySelectorAll('[data-ics-single]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const [school, label, date] = el.getAttribute('data-ics-single').split('|');
        downloadICS('deadline.ics', buildICS([{title: school+' \u2014 '+label, date, desc:''}]));
        el.textContent = '\u2713';
        el.classList.add('added');
        setTimeout(()=>{ el.textContent = '\u2795'; el.classList.remove('added'); }, 2000);
      });
    });
    // Bulk: all upcoming deadlines
    const calAll = document.getElementById('cal-all');
    if(calAll){
      calAll.addEventListener('click', ()=>{
        const events = allDeadlines().filter(d=>daysUntil(d.date)>=0)
          .map(d=>({title: d.school+' \u2014 '+d.label, date: d.date, desc:''}));
        downloadICS('ethan-college-deadlines.ics', buildICS(events));
        calAll.textContent = 'Added \u2713 Check your Downloads / Files app';
        calAll.classList.add('copied');
        setTimeout(()=>{ calAll.textContent = '\u2795 Add All Deadlines to Calendar'; calAll.classList.remove('copied'); }, 2500);
      });
    }
    const ncToggle = document.getElementById('nc-toggle');
    if(ncToggle){
      ncToggle.addEventListener('click', ()=>{
        state.ncOnly = !state.ncOnly;
        render();
        currentTab='schools';
      });
    }
    // Per-school notes: update state + debounced save WITHOUT full re-render (keeps cursor/focus intact)
    document.querySelectorAll('[data-note]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const id = el.getAttribute('data-note');
        state.schoolNotes[id] = el.value;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(()=>{
          saveState();
          const flag = document.getElementById('flag-'+id);
          if(flag){
            flag.classList.add('show');
            clearTimeout(flagTimer);
            flagTimer = setTimeout(()=>flag.classList.remove('show'), 1200);
          }
        }, 500);
      });
    });
    // General journal
    const addBtn = document.getElementById('add-journal');
    if(addBtn){
      addBtn.addEventListener('click', ()=>{
        const ta = document.getElementById('journal-input');
        const text = ta.value.trim();
        if(!text) return;
        const tagEl = document.querySelector('.tag-opt.sel');
        const tag = tagEl ? tagEl.getAttribute('data-tag') : 'General';
        state.journal.unshift({text, tag, date:new Date().toISOString()});
        saveState();
        currentTab='notes';
        render();
      });
    }
    document.querySelectorAll('[data-jtag]').forEach(el=>{
      el.addEventListener('click', ()=>{
        document.querySelectorAll('.tag-opt').forEach(t=>t.classList.remove('sel'));
        el.classList.add('sel');
      });
    });
    document.querySelectorAll('[data-jdel]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = parseInt(el.getAttribute('data-jdel'),10);
        state.journal.splice(idx,1);
        saveState();
        currentTab='notes';
        render();
      });
    });
    const copyBtn = document.getElementById('copy-email');
    if(copyBtn){
      copyBtn.addEventListener('click', async ()=>{
        let ok = false;
        try{
          await navigator.clipboard.writeText(EMAIL_TEMPLATE);
          ok = true;
        }catch(e){
          try{
            const ta = document.createElement('textarea');
            ta.value = EMAIL_TEMPLATE;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          }catch(e2){ ok = false; }
        }
        copyBtn.textContent = ok ? 'Copied \u2713' : 'Couldn\u2019t copy \u2014 select text manually';
        copyBtn.classList.toggle('copied', ok);
        setTimeout(()=>{ copyBtn.textContent = 'Copy Template'; copyBtn.classList.remove('copied'); }, 2000);
      });
    }
  }

  async function saveState(){
    try{
      await window.storage.set('ethan-tracker-state', JSON.stringify(state), false);
    }catch(e){ console.error('Save failed', e); }
  }

  async function loadState(){
    try{
      const result = await window.storage.get('ethan-tracker-state', false);
      if(result && result.value){
        const loaded = JSON.parse(result.value);
        state = Object.assign({schoolStatus:{}, checklist:{}, openSchools:{}, ncOnly:false, schoolNotes:{}, journal:[]}, loaded);
      }
    }catch(e){ /* no saved state yet */ }
    render();
  }

  loadState();
})();
</script>

</body>
</html>
